[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "conversational-rag-platform"
version = "0.1.0"
description = "Production-ready conversational RAG platform for JSON Q&A knowledge bases"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langchain-chroma>=1.0,<2.0",
    "langchain-community>=0.4,<1.0",
    "langchain-core>=1.0,<2.0",
    "langchain-groq>=1.0,<2.0",
    "langchain-huggingface>=1.0,<2.0",
    "pydantic-settings>=2.7,<3.0",
    "sentence-transformers>=5.0,<6.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
